<h2 id="current-setup">Current Grows</h2>
<div>
    <ul>
      {% for plant in site.data.grows %}
          {%- if plant.harvestDate == nil -%}
          <li class="growbox">
            <strong>{{ plant.seed }}</strong>
            <p>Sow Date: {{ plant.sowDate }}</p>
            <p> Current Day: {% 'today'| Date "%s" | minus plant.sowDate | date "%s" %} </p>
          </li>
          {%- endif -%}
      {% endfor %}
    </ul>
</div>
