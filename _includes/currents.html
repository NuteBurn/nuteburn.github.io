<h2 id="current-setup">Current Grows</h2>
<div>
    <ul>
      {% for plant in site.data.grows %}
          {%- if plant.harvestDate == nil -%}
          <li class="growbox">
            <strong>{{ plant.seed }}</strong>
            <p>Current Day: {{ "now" | date: "%j" | minus {{plant.sowDate | date: "%j"}} }} </p>
            <p>Sow Date: {{ plant.sowDate | date: "%m/%d/%Y" }}</p>
          </li>
          {%- endif -%}
      {% endfor %}
    </ul>
</div>
