{% assign imageurls = include.links | split: ", " %}
<div id="imagebox" class="flex-container">
{% for imageurl in imageurls %}
{% assign imgname = imageurl | split: '/' |  last %}
<a href="{{imageurl}}" data-lightbox="{{imgname}}" data-title="{{imgname}}"><img class="example-image" src="{{imageurl}}" alt="{{imgname}}"/></a>
{% endfor %}
</div>
