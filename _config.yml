# Setup
title:            NuteBurn
tagline:          "A Grow Journal"
description:      "Just some asshole with a blog trying to grow some dank-ass weed."
url:              https://nuteburn.com
baseurl:          '/'
permalink:        /:title
shareimage:       https://repository-images.githubusercontent.com/340120407/f9ffddfc-fa04-430c-bf5e-d97dc2002982

# Kramdown is used to generate the TOC on pages
markdown:         kramdown

# Pagination
paginate:         5
paginate_path: "/blog/page:num/"

# Collections for tag/category pages
collections:
  tags:
    output: true
    permalink: /tags/:name/
  resource_categories:
    output: true
    permalink: /resources/category/:name/

# Defaults - automate front matter
defaults:
  # Wide layout for resource and equipment pages
  - scope:
      path: "resources.md"
    values:
      custom_class: "wide-layout"
  # Tag pages
  - scope:
      type: "tags"
    values:
      layout: "tag"

# Gems
plugins:
  - jekyll-paginate

# Author
author:
  name: "Nute Burn"
  email: nute@nuteburn.com

# SASS
sass:
  sass_dir: _sass
  style: compressed
  implementation: sass-embedded

# Social Media Profiles
socialmedia:

  - title: GitHub
    link: https://github.com/NuteBurn/nuteburn.github.io
    user: nuteburn
    fa-icon: 'fab fa-github'

  - title: Mastodon
    link: https://masto.nuteburn.com/@Nute
    user: NuteBurn
    fa-icon: 'fab fa-mastodon'

  - title: Email
    link: "mailto:nute@nuteburn.com"
    user: NuteBurn
    fa-icon: 'fa-solid fa-envelope'
